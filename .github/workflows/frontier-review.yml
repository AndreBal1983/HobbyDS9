name: Frontier reconnaissance (provisional headless)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    name: Frontier review (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore HobbyDS9.slnx --locked-mode
      - run: dotnet build HobbyDS9.slnx -c Release --no-restore
      - run: dotnet test tests/HobbyDS9.Simulation.Tests/HobbyDS9.Simulation.Tests.csproj -c Release --no-build --no-restore --filter FullyQualifiedName~FrontierTests
      - run: dotnet run --project src/HobbyDS9.Headless -c Release --no-build --no-restore -- --frontier-review
