name: Restore, build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore HobbyDS9.slnx --locked-mode
      - name: Build
        run: dotnet build HobbyDS9.slnx --configuration Release --no-restore
      - name: Prepare portable Unity integration (no Editor required)
        run: dotnet msbuild scripts/PrepareUnity.proj -t:Prepare
      - name: Check Unity assets and assembly boundary (static only)
        run: python scripts/check-unity-integration.py
      - name: Test
        run: dotnet test HobbyDS9.slnx --configuration Release --no-build --no-restore
      - name: Phased combat headless smoke (25 turns)
        run: dotnet run --project src/HobbyDS9.Headless --configuration Release --no-build --no-restore -- --turns 25
      - name: Reverse phased combat resolution smoke (25 turns)
        run: dotnet run --project src/HobbyDS9.Headless --configuration Release --no-build --no-restore -- --turns 25 --combat-order reverse
      - name: Repeated phased combat resolution smoke (25 turns)
        run: dotnet run --project src/HobbyDS9.Headless --configuration Release --no-build --no-restore -- --turns 25
      - name: Playable tactical sandbox scripted smoke and round-boundary resume
        run: |
          dotnet run --project src/HobbyDS9.TacticalPlayground --configuration Release --no-build --no-restore -- --scenario cruiser --seed 47 --script "Flank;Flank;Flank"
          dotnet run --project src/HobbyDS9.TacticalPlayground --configuration Release --no-build --no-restore -- --scenario screen --seed 47 --script "Screen;Charge;Screen"
          dotnet run --project src/HobbyDS9.TacticalPlayground --configuration Release --no-build --no-restore -- --scenario breakthrough --seed 47 --script "Breakthrough;Breakthrough"
          dotnet run --project src/HobbyDS9.TacticalPlayground --configuration Release --no-build --no-restore -- --scenario cruiser --seed 47 --script "Flank" --stop-after 1 --save artifacts/tactical-playground/ci-save.json
          dotnet run --project src/HobbyDS9.TacticalPlayground --configuration Release --no-build --no-restore -- --resume artifacts/tactical-playground/ci-save.json --script "Flank;Flank"
