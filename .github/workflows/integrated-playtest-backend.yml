name: Integrated campaign playtest backend (headless only)

on:
  push:
  pull_request:

jobs:
  verify:
    name: Integrated backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore HobbyDS9.slnx --locked-mode
      - name: Release build
        run: dotnet build HobbyDS9.slnx -c Release --no-restore
      - name: Actual integrated strategy, construction, combat and failure boundaries
        run: dotnet test tests/HobbyDS9.Simulation.Tests/HobbyDS9.Simulation.Tests.csproj -c Release --no-build --no-restore --filter FullyQualifiedName~IntegratedPlaytestTests
      - name: Same-session paid construction, earned Engineering, combat and complete-root determinism
        run: dotnet run --project src/HobbyDS9.Headless -c Release --no-build --no-restore -- --review-integrated-playtest
