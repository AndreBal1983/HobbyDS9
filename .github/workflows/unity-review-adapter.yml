name: Unity review adapter actual-source portable checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  adapter:
    name: Actual Unity codec and slot source (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Compile portable actual source and execute backend-linked tests
        shell: pwsh
        run: |
          $project = 'tests/HobbyDS9.UnityReviewAdapter.Tests/HobbyDS9.UnityReviewAdapter.Tests.csproj'
          dotnet restore $project --locked-mode -warnaserror
          if ($LASTEXITCODE -ne 0) { throw 'Locked restore failed' }
          dotnet build $project -c Release --no-restore -warnaserror
          if ($LASTEXITCODE -ne 0) { throw 'Portable actual-source build failed' }
          dotnet test $project -c Release --no-build --no-restore --logger 'trx;LogFileName=unity-adapter.trx' --results-directory artifacts/unity-review-adapter
          if ($LASTEXITCODE -ne 0) { throw 'Actual-source tests failed' }
          [xml]$trx = Get-Content -LiteralPath 'artifacts/unity-review-adapter/unity-adapter.trx'
          $c = $trx.TestRun.ResultSummary.Counters
          if ([int]$c.total -lt 78 -or [int]$c.passed -ne [int]$c.total -or [int]$c.failed -ne 0 -or [int]$c.notExecuted -ne 0) { throw 'Missing or unexecuted adapter cases' }
          Write-Host "Actual-source portable cases: $($c.passed) passed; Editor/AOT/native not executed"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Binding configuration and adversarial source checks only
        run: |
          python scripts/check-unity-review-binding.py
          python -B -m unittest discover -s tests/UnityReviewBinding.Static -p "test_*.py" -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-review-adapter-${{ matrix.os }}
          path: artifacts/unity-review-adapter/*.trx
          if-no-files-found: error
