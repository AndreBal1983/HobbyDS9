<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HobbyDS9 • Combat viewer proposal</title>
<style>
:root{color-scheme:dark;--accent:#a58bc4;--structure:#d99552;--cool:#6997b8;--bg:#05070a;--panel:#101722;--text:#f1e8d8;--muted:#b8c1cc;--line:#536275;--good:#8fc5af;--error:#e39a8e;font:17px/1.45 system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:#080d15;color:var(--text)}button,select{font:inherit;min-height:44px;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:#182333;color:var(--text)}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #fff;outline-offset:3px}button:disabled{cursor:default;color:#c1c7cf;background:#111b29;border-style:dashed;opacity:.85}label{display:flex;gap:10px;align-items:center}h1,h2,h3,p{margin:0}h1{font-size:25px}h2{font-size:20px}h3{font-size:17px}small,.muted{color:var(--muted)}small{font-size:15px}a{color:#b4d8fa}header.review{padding:20px 26px;background:#101927;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}.review p{max-width:72ch;margin-top:6px}.tools{display:flex;gap:12px;flex-wrap:wrap}.tabs{display:flex;flex-wrap:wrap;gap:8px;padding:16px 26px}.tabs button[aria-selected=true]{background:var(--accent);color:#080b12;border-color:var(--accent);font-weight:700}.workspace{padding:0 26px 28px;display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:22px;align-items:start}.frame{width:100%;max-width:1920px;margin:auto;background:var(--bg);border:2px solid var(--accent);border-left:14px solid var(--structure);border-radius:26px 26px 18px 6px;overflow:hidden;display:flex;flex-direction:column;height:780px;min-width:0}.frame[data-width=narrow]{max-width:1200px;height:620px}.frame[data-width=wide]{max-width:2100px;height:880px}.battle-head{padding:14px 20px;background:#171c2b;border-bottom:5px solid var(--accent);display:flex;justify-content:space-between;align-items:center;gap:16px}.kicker{font-size:14px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent)}.badge{display:inline-block;padding:3px 8px;border:1px solid currentColor;border-radius:5px;font-size:14px}.state-banner{padding:10px 20px;border-bottom:1px solid var(--line);background:#152536;display:flex;gap:12px;align-items:center}.state-banner.warn{background:#33231f}.badge.good{color:var(--good)}.layout{display:grid;grid-template-columns:205px minmax(0,1fr) 300px;gap:12px;flex:1;min-height:0;padding:14px}.panel{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--panel);min-width:0;overflow:auto}.rail{display:flex;flex-direction:column;gap:12px}.fleet{padding:12px;border-left:4px solid var(--cool);background:#172638;border-radius:6px}.fleet.active{border-color:var(--accent);outline:1px solid var(--accent)}.fleet.enemy{border-color:var(--error)}.fleet p{margin-top:5px}.center{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}.stage{position:relative;flex:1;min-height:180px;overflow:hidden;border:1px solid #33485e;border-radius:16px;background:radial-gradient(ellipse at 60% 50%,#122c42,#050a13 75%);display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:28px;gap:22px}.stage:before{content:'SCHEMATIC STAGING • NOT PHYSICAL POSITIONS';position:absolute;top:12px;left:16px;right:12px;color:#9eafc1;font-size:12px;letter-spacing:.08em}.formation{text-align:center;position:relative;z-index:1}.ship{width:95px;height:40px;margin:8px auto;background:#95afc4;clip-path:polygon(0 50%,34% 10%,65% 16%,100% 50%,65% 84%,34% 90%)}.ship.hostile{background:#bd9270;transform:rotate(180deg)}.relation{position:absolute;bottom:14px;left:14px;right:14px;text-align:center;font-size:15px;color:#c4d4e6}.summary{padding:12px 14px;background:#121e2d;border:1px solid var(--line);border-radius:10px}.summary p+p{margin-top:7px}.order{display:flex;flex-direction:column;gap:12px}.line{border-top:1px solid var(--line);padding-top:10px}.field{border:1px solid var(--line);padding:9px;border-radius:6px}.field strong{display:block}.draft{border-left:4px solid var(--structure);padding:10px;background:#30271e}.receipt{border-left:4px solid var(--good);padding:10px;background:#122b26}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:6px}.metric{padding:6px;background:#1c293a;border-radius:4px;font-size:15px}.metric b{display:block}.events{max-height:150px;overflow:auto}.events p{padding:5px 0;border-bottom:1px solid #344253}.footer{padding:12px 18px;border-top:4px solid var(--structure);display:flex;gap:10px;align-items:center;justify-content:space-between;background:#111925;flex-shrink:0}.footer-actions{display:flex;flex-wrap:wrap;gap:8px}.primary{background:var(--accent);color:#080b12;font-weight:700}.ann{display:inline-grid;place-items:center;width:23px;height:23px;border:1px solid var(--structure);color:var(--structure);border-radius:50%;font-size:13px;font-weight:700;margin-right:6px;vertical-align:middle}.annotations{background:#121c2b;padding:18px;border-radius:14px;border:1px solid var(--line)}.annotations ol{padding-left:22px}.annotations li{margin:12px 0}.annotations p{margin-top:12px}.aftermath{grid-template-columns:minmax(0,1fr) 340px}.survivors{width:100%;border-collapse:collapse;font-size:16px}.survivors th,.survivors td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);white-space:normal}.survivors th{color:var(--accent)}.actions{display:grid;gap:8px}.action{border:1px solid var(--line);padding:10px;border-radius:8px}.action.selected{border:2px solid var(--structure);background:#30271e}.action.quiet{color:var(--muted)}.status-note{padding:12px;border:1px solid var(--structure);margin-top:16px}.error{color:var(--error)}.center-note{padding:26px;text-align:center;max-width:60ch;margin:auto}.subtabs{display:flex;gap:12px;font-size:15px;padding:8px 0;color:var(--accent)}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}.frame[data-width=narrow] .layout{grid-template-columns:minmax(0,1fr) 290px}.frame[data-width=narrow] .rail{grid-column:1/-1;flex-direction:row;overflow:auto;padding:8px}.frame[data-width=narrow] .rail h3{align-self:center;font-size:15px}.frame[data-width=narrow] .fleet{min-width:165px;padding:8px}.frame[data-width=narrow] .rail small{display:none}.frame[data-width=narrow] .layout:not(.aftermath){grid-template-rows:auto minmax(0,1fr)}.frame[data-width=narrow] .stage{padding:32px 20px 45px;min-height:150px}.frame[data-width=narrow] .stage .ship{height:28px;margin:4px auto}.frame[data-width=narrow] .summary{padding:8px 12px;max-height:102px;overflow:hidden}.frame[data-width=narrow] .events{max-height:56px}.frame[data-width=narrow] .order .inspector{display:none}.frame[data-width=narrow] .aftermath{grid-template-columns:minmax(0,1fr) 310px}.frame[data-width=narrow] .survivors th,.frame[data-width=narrow] .survivors td{padding:8px 5px;font-size:15px}.frame[data-width=wide] .layout{grid-template-columns:230px minmax(0,1fr) 330px}.frame[data-width=wide] .aftermath{grid-template-columns:minmax(0,1fr) 360px}
@media(max-width:1400px){.workspace{grid-template-columns:minmax(0,1fr)}.annotations{display:grid;grid-template-columns:1fr 2fr;gap:20px}.annotations ol{margin:0}.frame{height:680px}}@media(max-width:950px){.workspace{padding:0 10px 18px}.frame{height:860px}.layout,.frame[data-width=wide] .layout{grid-template-columns:minmax(0,1fr) 265px}.rail{grid-column:1/-1;flex-direction:row;overflow:auto}.rail h3{font-size:15px}.fleet{min-width:150px}.battle-head{padding:12px}.aftermath,.frame[data-width=wide] .aftermath,.frame[data-width=narrow] .aftermath{grid-template-columns:1fr}.aftermath .panel{max-height:300px}.annotations{display:block}.footer{align-items:start}.footer small{display:none}}@media(max-width:650px){.frame,.frame[data-width=narrow],.frame[data-width=wide]{height:auto;min-height:900px}.layout,.frame[data-width=narrow] .layout,.frame[data-width=wide] .layout{display:flex;flex-direction:column}.stage{min-height:230px}.panel{max-height:300px}.order .inspector{display:none}.battle-head{align-items:start;flex-direction:column}.footer{position:sticky;bottom:0}.survivors{font-size:14px}.tools{display:block}.tools label{margin-top:8px}.annotations{font-size:16px}}
</style></head><body>
<header class="review"><div><h1>Combat viewer / aftermath</h1><p class="muted">Annotated design proposal • fictional data • no game connection or functioning battle commands.</p></div><div class="tools"><label>Layout<select id="width"><option value="narrow">Narrow · 1280 × 720 intent</option><option value="standard" selected>Standard · 1920 × 1080 intent</option><option value="wide">Wide · 3440 × 1440 intent</option></select></label><label>Faction accents<select id="theme"><option>Federation</option><option>Klingon</option><option>Cardassian</option><option>Romulan</option><option>Dominion</option></select></label></div></header>
<nav class="tabs" aria-label="Wireframe states"></nav>
<main class="workspace"><section class="frame" id="frame" data-width="standard" aria-label="Combat screen wireframe"></section><aside class="annotations"><div><h2>Annotations</h2><p id="purpose"></p><p><strong>Review boundary</strong><br>Token accents demonstrate shared layout only. Full faction artwork and 3D staging are future work.</p><p><a href="../combat-interface.md">Read proposal and contract gates</a></p></div><ol id="notes"></ol></aside></main>
<script>
const states=[['plan','Battle planning'],['waiting','Orders accepted'],['round','Round result'],['complete','Aftermath pending'],['survivors','Aftermath confirmed'],['defeat','No survivors'],['unavailable','Route / contact unavailable'],['hidden','No visible enemy']];
const mark=n=>`<span class="ann">${n}</span>`;
const mockButton=(label,primary=false)=>`<button disabled class="${primary?'primary':''}" title="Illustrative action only; no gameplay is connected">${label}</button>`;
const ownStocks=`<div class="metrics"><div class="metric"><b>Hull</b>90 / 100</div><div class="metric"><b>Torpedoes</b>0 / 3</div><div class="metric"><b>Fore</b>3 / 40</div><div class="metric"><b>Port</b>13 / 40</div><div class="metric"><b>Starboard</b>40 / 40</div><div class="metric"><b>Aft</b>5 / 40</div></div>`;
function head(status,round='Round 1 / up to 3'){return `<div class="battle-head"><div><div class="kicker">${mark(1)}Tactical command · Federation</div><h2>Bajor sector · ${status}</h2></div><div><span class="badge">Illustrative review profile</span><p class="muted">${round}</p></div></div>`}
function foot(left,right){return `<footer class="footer"><div class="footer-actions">${mockButton('Back to campaign')}${mockButton('Inspect / report')}</div><small>${left}</small><div>${mockButton(right,true)}</div></footer>`}
function fleets(hidden=false){return `<aside class="panel rail"><h3>${mark(2)}Your fleets</h3><div class="fleet active"><strong>Expedition fleet</strong><p>Selected · 3 ships</p><small>One command unit</small></div><div class="fleet"><strong>Border patrol</strong><p>Separate fleet</p><small>Own orders retained</small></div><h3>Visible hostiles</h3>${hidden?'<p class="muted">No visible enemy.</p>':'<div class="fleet enemy"><strong>Hostile contact A</strong><p>Observed ships only</p><small>Inspect condition</small></div>'}</aside>`}
function stage(hidden=false){return `<div class="stage"><div class="formation"><div class="ship"></div><strong>Expedition fleet</strong></div><div class="formation">${hidden?'<p>No visible enemy</p>':'<div class="ship hostile"></div><strong>Observed contact A</strong>'}</div><div class="relation">${mark(3)}${hidden?'No permitted enemy relation to display':'Selected fleet pair · Distant · reported facing only'}</div></div>`}
function inspector(){return `<div class="inspector line"><h3>Your selected ship</h3><small>Exact own stocks · illustrative</small>${ownStocks}<p class="muted">Visible enemy: type / hull condition / shields only. No reserves or new orders.</p></div>`}
const notes={
 plan:['Header names the active boundary; opening range comes from authority.','Separate strategic fleets retain separate command identities. Ship selection is inspection.','Schematic arrangement is presentation only; no steering, physical distance or collision authority.','Standing intent and unsent changes are distinct. Screen protects this fleet only.','Review all own fleet orders before an explicit round commitment. Enter in a field never commits.'],
 waiting:['This player’s accepted receipt is the evidence.','Own fleet and visible enemy inspection remain accessible.','No opponent readiness, private commitment count or progress percentage.','Accepted orders are locked for this boundary; no cancel/edit promise is invented.','Save/resume is shown only when supported by the active host; it does not commit later rounds.'],
 round:['One round resolved; later human choices are still pending.','List/report filters contain only permitted identities.','Range changes and reveal are backend facts; hidden firing does not reveal early.','Report explains lawful fallback while preserving standing enemy preference.','Plan next round explicitly; opening or replaying this summary never resolves combat.'],
 complete:['This encounter is complete; its aftermath is still staged.','Owned survivor losses and pools remain readable before confirmation.','The batch may contain other encounters; public readiness alone enables confirmation.','Next-turn travel choices stay unavailable until aftermath is accepted.','One atomic finalization. Failure keeps staged reports and the current turn.'],
 survivors:['Aftermath is confirmed; the displayed turn is the new authoritative Planning boundary.','Owned losses and four shield sectors are retained, with exact own ammunition.','Quiet Stay is a proposed visible low-emphasis option. It does not prevent hostile engagement.','Leave and Follow draft fresh strategic routes; no tactical escape or guaranteed catch.','Review/submit an order separately; strategic advancement happens later. No automatic refill.'],
 defeat:['No owned fleet survives this encounter.','Show owned losses; enemy survival remains limited to permitted observations.','Pending batch finalization is still required even when this actor has no survivor.','No destination/follow picker or active fleet order is offered for destroyed fleets.','After confirmation return to campaign. No extra defeat exit, resurrection or recovery rule.'],
 unavailable:['Confirmed aftermath stays separate from the rejected unsent order.','Contact label comes from lawful prior knowledge; no new survival/location fact is inferred.','Keep the draft and explain route/contact availability using the authoritative reason.','Choose another known destination/contact; never reveal hidden route, orders or future position.','Submit stays disabled; the last accepted order remains in effect. No silent fallback or retry.'],
 hidden:['An authoritative encounter may have no currently visible enemy.','No hidden names, ships, fleet counts, ghost markers or opponent commitments.','Own maneuver remains available; do not replace it with Screen automatically.','Round-one cloak behavior is authoritative; mutual cloak can yield maneuver-only round one.','Normal review and explicit commitment. No pre-round bonus volley or extra round.']};
let current='plan';
function render(id){current=id;const frame=document.querySelector('#frame');document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.state===id)));let html='';
if(['plan','waiting','round','hidden'].includes(id)){
 const hidden=id==='hidden',waiting=id==='waiting',round=id==='round';
 html=head(waiting?'Orders accepted':round?'Round 1 resolved':'Orders for this round',round?'Round 2 awaits orders':'Round 1 / up to 3');
 html+=`<div class="state-banner ${hidden?'warn':''}">${mark(1)}${waiting?'<span class="badge good">Own receipt accepted</span> Waiting for round resolution.':round?'Round result available. No next-round orders committed.':hidden?'No visible enemy. Proceed cautiously; standing orders are unchanged.':'Review-profile controls only · unsent edits do not change the battle.'}</div>`;
 html+=`<div class="layout">${fleets(hidden)}<div class="center">${stage(hidden)}<div class="summary"><h3>${mark(4)}${round?'Round report':'Boundary summary'}</h3><div class="events">${round?'<p>Incoming torpedo intercepted; launcher not identified in that observation.</p><p>End of round 1: surviving cloaked ships revealed.</p><p>Preferred fleet unavailable for an opportunity; lawful visible alternative used. Standing preference retained.</p>':waiting?'<p>Your round orders were accepted. The next result is not available yet.</p><p>No opposing commitment status is disclosed.</p>':'<p>Your fleet is a single command unit. Individual targets and defensive actions are automatic.</p><p>Own stocks can be inspected without changing orders.</p>'}</div></div></div><aside class="panel order"><h3>${mark(4)}Expedition fleet</h3><div class="field"><small>Standing maneuver</small><strong>Maintain distance</strong></div>${waiting?'<div class="receipt"><strong>Committed this round</strong><p>Screen · contact A preferred</p></div>':round?'<div class="receipt"><strong>Last round confirmed</strong><p>Screen · preference retained</p></div>':'<div class="draft"><strong>Unsent order draft</strong><p>Maneuver: Screen ▾</p><p>Enemy preference: '+(hidden?'No visible choice':'Contact A ▾')+'</p></div>'}<small>Same-fleet screening only. Enemy preference does not guarantee a shot.</small>${inspector()}</aside></div>`;
 html+=foot(`${mark(5)}${waiting?'Own accepted boundary only':round?'One resolved round':'No orders submitted by inspection'}`,waiting?'Waiting for round resolution':round?'Plan round 2':'Review round orders');
}else{
 const pending=id==='complete'||id==='defeat',defeat=id==='defeat',bad=id==='unavailable';
 html=head(defeat?'No owned survivors':pending?'Battle complete':'Aftermath confirmed',pending?'Battle turn 12 · confirmation pending':'Planning turn 13 · illustrative');
 html+=`<div class="state-banner ${bad?'warn':''}">${mark(1)}${pending?'Battle result — pending campaign confirmation.':bad?'Aftermath confirmed. Follow draft is unavailable; accepted Stay order is unchanged.':'Confirmed losses and retained stocks. New strategic orders are separate.'}</div>`;
 html+=`<div class="layout aftermath"><section class="panel"><h3>${mark(2)}${defeat?'Owned losses':'Expedition fleet · survivor report'}</h3><p class="muted">${defeat?'No owned ship survived.':'2 surviving ships · 1 owned loss · travel stopped in Bajor.'} Illustrative data.</p>${defeat?'<div class="center-note"><h2>Fleet lost</h2><p>No surviving fleet can receive a movement or follow order.</p><p class="muted">Other owned fleets elsewhere are not inferred from this report.</p></div>':`<div style="overflow:auto"><table class="survivors"><caption class="sr-only">Illustrative own retained survivor stocks</caption><thead><tr><th>Own ship</th><th>Hull</th><th>Fore</th><th>Port</th><th>Starboard</th><th>Aft</th><th>Torpedoes</th></tr></thead><tbody><tr><td>Cruiser</td><td>90/100</td><td>3/40</td><td>13/40</td><td>40/40</td><td>5/40</td><td>0/3</td></tr><tr><td>Escort</td><td>42/60</td><td>6/20</td><td>2/15</td><td>8/15</td><td>0/10</td><td>1/2</td></tr></tbody></table></div><div class="status-note"><strong>${mark(3)}Retained state</strong><p>No automatic repair, shield recovery or ammunition refill between battles. Interrupted routes do not resume.</p></div><div class="summary" style="margin-top:16px"><h3>Battle report</h3><p>Own losses and permitted observed events remain inspectable.</p><small>Enemy ammunition and fresh orders remain private.</small></div>`}</section><aside class="panel order"><h3>${mark(4)}${pending?'Aftermath boundary':'Next action · selected fleet'}</h3>${pending?`<div class="receipt"><strong>${defeat?'This battle is complete':'Survivors are staged'}</strong><p>Waiting to confirm campaign consequences once.</p></div><p>Confirm is enabled only when the whole batch is ready.</p><div class="field">${defeat?'No survivor orders':'Travel choices unlock after confirmation'}</div><small>The mock button is disabled because this document is not connected.</small>`:`<small>Draft for Planning turn 13. Accepted order: Stay.</small><div class="actions"><div class="action quiet">Stay <small>· no request to engage</small></div><div class="action ${bad?'':'selected'}">Stay / seek combat<p><small>New lawful contact required on advance.</small></p></div><div class="action">Leave<p><small>Known destination → explicit route.</small></p></div><div class="action ${bad?'selected':''}">Follow<p><small>Known contact → explicit known route.</small></p></div></div>${bad?'<div class="draft"><strong class="error">Unsent Follow unavailable</strong><p>Known contact record is stale. Choose a fresh lawful contact and route.</p><small>No current enemy location or intention disclosed.</small></div>':'<div class="draft"><strong>Unsent: Stay / seek combat</strong><p>Remains in Bajor. No immediate second battle or guaranteed engagement.</p></div>'}`}</aside></div>`;
 html+=foot(`${mark(5)}${pending?'Atomic confirmation, once':'Order submission does not advance time'}`,pending?'Confirm aftermath':bad?'Order unavailable':'Review next-turn order');
}
frame.innerHTML=html;document.querySelector('.kicker').innerHTML=mark(1)+'Tactical command · '+document.querySelector('#theme').value;document.querySelector('#purpose').textContent=states.find(s=>s[0]===id)[1]+' — illustrative owner-review state.';document.querySelector('#notes').innerHTML=notes[id].map(n=>`<li>${n}</li>`).join('');}
document.querySelector('.tabs').innerHTML=states.map(([id,label])=>`<button data-state="${id}" aria-selected="false">${label}</button>`).join('');
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>render(b.dataset.state)));
document.querySelector('#width').addEventListener('change',e=>document.querySelector('#frame').dataset.width=e.target.value);
document.querySelector('#theme').addEventListener('change',e=>{const palettes={Federation:['#a58bc4','#d99552'],Klingon:['#d7a18e','#a96e61'],Cardassian:['#d7b46a','#ad844c'],Romulan:['#80bfa6','#649c9a'],Dominion:['#b5a6da','#8b91bc']};let p=palettes[e.target.value];document.documentElement.style.setProperty('--accent',p[0]);document.documentElement.style.setProperty('--structure',p[1]);document.querySelector('.kicker').innerHTML=mark(1)+'Tactical command · '+e.target.value;});
render('plan');
</script></body></html>
